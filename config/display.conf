# Display board settings, read by ~/mm-display.sh. Script 02 copies this to
# ~/.config/mm-display.conf on every update, so change it here and push.
#
# NIGHT_OFF  1 = switch the display board off in the quiet hours, 0 = never
# OFF_AT     24 h HH:MM the panel goes dark
# ON_AT      24 h HH:MM it comes back (may be earlier than OFF_AT: spans midnight)
NIGHT_OFF=1
OFF_AT="23:00"
ON_AT="05:00"

# Picture, 0-100 each, held every 5 min while the panel is on. A value set
# with ddcutil alone can be lost when the board loses power; these put it back.
# Blank leaves the board's own setting. Board defaults: contrast 50, gain 50.
# GAIN is red, green and blue together.
BRIGHTNESS=100
CONTRAST=75
GAIN=""
